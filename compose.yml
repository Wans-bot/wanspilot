# yaml-language-server: $schema=./compose.schema.json
# wanspilot：挑片 + 把任务交给 qBittorrent，自己不跑 BT 引擎。
#
# 用法：
#   docker compose up -d
#   docker compose logs -f      # 出现 [entry] wanspilot starting 即启动完成
#
# 部署时**不用**填 qB 的地址和账号：容器起来后打开 http://<NAS 局域网 IP>:3000
# → 设置 → qBittorrent，在网页里填地址、用户名、密码，点「测试 qB 连接」通过后再保存。
#
# 地址务必填 NAS 的局域网 IP + qB 的 WebUI 端口（例如 http://192.168.1.10:<端口号>），
# 不要填 127.0.0.1 / localhost —— 容器里的 127.0.0.1 指向 wanspilot 自己，连不到 NAS 上的 qB。

services:
  wanspilot:
    image: ghcr.io/wans-bot/wanspilot:latest
    container_name: wanspilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      # 容器内以该 UID/GID 运行，建议与 NAS 上拥有下载目录的用户一致
      PUID: 1000
      PGID: 1000
      # ---- 可选：预置 TMDB Key，省得进设置页填 ----
      # WP_TMDB_API_KEY: ""
    volumes:
      - ./data:/data
      # 可选：想让 wanspilot 自己把下完的文件归档（写 .nfo/海报）时，再把 qB 的下载目录
      # 按同一路径挂进来，然后在设置页「本地挂载路径」填容器内的路径。
      # 不挂也能正常下载与看进度，只是自动整理会跳过。
      # - /volume1/downloads:/downloads
