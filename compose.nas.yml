services:
  wanspilot:
    build: .
    image: wanspilot:1.1.0-local
    container_name: wanspilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      PUID: "0"
      PGID: "0"
      WP_USERNAME: "admin"
      WP_PASSWORD: "请改成自己的密码至少8个字符"
    volumes:
      - ./data:/data
      - /volume1/video:/video
