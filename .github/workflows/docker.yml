name: docker

# 默认只推到 GHCR（ghcr.io/wans-bot/wanspilot），用仓库自带的 GITHUB_TOKEN，零配置即可构建。
# 如果额外配了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个 secret，
# 会用 buildx imagetools 把同一份多架构镜像原样复制到 Docker Hub（wansbot/wanspilot），不重新编译。

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_IMAGE: ghcr.io/wans-bot/wanspilot
      HUB_IMAGE: wansbot/wanspilot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wans-bot/wanspilot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r ref; do
            [ -z "$ref" ] && continue
            tag="${ref##*:}"
            docker buildx imagetools create --tag "${HUB_IMAGE}:${tag}" "$ref"
          done
